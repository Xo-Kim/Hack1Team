spring:
  application:
    name: Back

  config:
    # API 키는 Back/application-local.yaml 에 넣는다 (.gitignore 처리됨).
    # optional: 이라 파일이 없어도 기동에 실패하지 않고, classpath 가 아니라
    # 실행 디렉터리를 읽으므로 jar 안에 시크릿이 딸려 들어가지 않는다.
    # 환경변수를 쓰면 그쪽이 우선한다.
    import: optional:file:./application-local.yaml

server:
  # PaaS(Railway·Render·Heroku 등)는 PORT 를 주입하고 그 포트로만 트래픽을 보낸다.
  # 여기에 붙지 않으면 앱은 정상 기동하는데 헬스체크가 계속 실패한다.
  # 로컬에서 포트가 겹칠 때는 SERVER_PORT 로 덮어쓴다.
  port: ${PORT:${SERVER_PORT:8080}}

logging:
  level:
    com.example.back: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    doc-expansion: none
  api-docs:
    path: /v3/api-docs

mood-mirror:
  llm:
    # 비워두면 자동으로 mock 모드로 동작한다 (API 키 없이 전체 플로우 시연 가능).
    api-key: ${OPENAI_API_KEY:}
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
    vision-model: ${LLM_VISION_MODEL:gpt-4o}
    text-model: ${LLM_TEXT_MODEL:gpt-4o-mini}
    connect-timeout-seconds: 10
    read-timeout-seconds: 40
  music:
    jamendo:
      # devportal.jamendo.com 에서 무료 발급. 비워두면 절차적 앰비언스로 폴백한다.
      client-id: ${JAMENDO_CLIENT_ID:}
      base-url: https://api.jamendo.com/v3.0
      # 조명 연출 시작을 막지 않도록 짧게 끊는다. 실패해도 폴백이 받아준다.
      timeout-seconds: 4

  cors:
    # Vite proxy 를 쓰면 동일 출처가 되어 로컬에서는 사용되지 않는다.
    #
    # 배포에서 프론트를 백엔드와 다른 도메인에 올리면 여기에 그 출처를 넣어야 한다.
    # 코드를 고치지 않고 CORS_ALLOWED_ORIGINS 환경변수로 덮어쓴다 (쉼표 구분).
    #   예: CORS_ALLOWED_ORIGINS=https://mood-mirror.vercel.app
    # 프론트를 같은 서버에서 서빙하면 동일 출처라 이 설정은 필요 없다.
    allowed-origins: >-
      ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

    # 직원 화면 출처. 고객 목록과 <b>일부러 갈라 둔다</b> — 제품 추천이 나가는 유일한
    # 통로라, 한 목록이면 고객 프론트 주소를 넣는 순간 직원 경로까지 열린다.
    # 비어 있으면 /api/staff/** 는 CORS 를 아예 열지 않는다(동일 출처 전용).
    #   예: CORS_STAFF_ORIGINS=https://mood-mirror-front.up.railway.app
    staff-origins: ${CORS_STAFF_ORIGINS:}
  session:
    ttl-minutes: 15
